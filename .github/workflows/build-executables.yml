name: Build Executables

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Required for creating releases

jobs:
  build:
    strategy:
      fail-fast: false  # Continue all builds even if one fails
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.10']
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Free disk space (Ubuntu/macOS)
      if: runner.os != 'Windows'
      run: |
        echo "Before cleanup:"
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean || true
        echo "After cleanup:"
        df -h
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-gui.txt
    
    - name: Clean up pip cache to save space
      run: |
        pip cache purge
        df -h
    
    - name: Build with PyInstaller
      run: python build_executable.py
    
    - name: Clean up build artifacts to save space
      shell: bash
      run: |
        rm -rf build/ *.spec
        pip uninstall -y torch torchvision torchaudio || true
        df -h
    
    - name: Check disk space after build
      run: df -h
    
    - name: Verify build output
      shell: bash
      run: |
        echo "Contents of dist/:"
        ls -lh dist/ || echo "dist/ not found"
        if [ -d "dist/SegmentLobes" ]; then
          echo "SegmentLobes directory exists"
          du -sh dist/SegmentLobes
        else
          echo "ERROR: SegmentLobes directory not found!"
          exit 1
        fi
    
    - name: Package executable
      shell: bash
      run: |
        cd dist
        if [ \"$RUNNER_OS\" == \"Windows\" ]; then
          ARTIFACT_NAME=\"SegmentLobes-Windows.zip\"
          powershell Compress-Archive -Path SegmentLobes -DestinationPath ../\"$ARTIFACT_NAME\"
        elif [ \"$RUNNER_OS\" == \"macOS\" ]; then
          ARTIFACT_NAME=\"SegmentLobes-macOS.zip\"
          zip -r ../\"$ARTIFACT_NAME\" SegmentLobes
        else
          ARTIFACT_NAME=\"SegmentLobes-Linux.tar.gz\"
          tar -czf ../\"$ARTIFACT_NAME\" SegmentLobes
        fi
        cd ..
        echo "Packaged artifact:"
        ls -lh SegmentLobes-* || echo "ERROR: Package not created!"
    
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: SegmentLobes-${{ matrix.os }}
        path: SegmentLobes-*
        if-no-files-found: error
        retention-days: 90
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: SegmentLobes-*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
