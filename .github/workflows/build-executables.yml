name: Build Executables

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated: windows,linux,macos or "all")'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write  # Required for creating releases

jobs:
  build-windows:
    runs-on: windows-latest
    if: |
      github.event_name == 'push' || 
      github.event.inputs.platforms == 'all' ||
      contains(github.event.inputs.platforms, 'windows')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-gui.txt
    
    - name: Clean up pip cache to save space
      run: |
        pip cache purge
        df -h
    
    - name: Build with PyInstaller
      run: python build_executable.py
    
    - name: Clean up build artifacts to save space
      shell: bash
      run: |
        rm -rf build/ *.spec
        pip uninstall -y torch torchvision torchaudio || true
        df -h
    
    - name: Check disk space after build
      run: df -h
    
    - name: Verify build output
      shell: bash
      run: |
        echo "Contents of dist/:"
        ls -lh dist/ || echo "dist/ not found"
        if [ -d "dist/SegmentLobes" ]; then
          echo "SegmentLobes directory exists"
          du -sh dist/SegmentLobes
          echo "Top 20 largest files/directories:"
          du -ah dist/SegmentLobes | sort -rh | head -20 || true
        else
          echo "ERROR: SegmentLobes directory not found!"
          exit 1
        fi
    
    - name: Package executable
      shell: bash
      run: |
        cd dist
        powershell Compress-Archive -Path SegmentLobes -DestinationPath ../SegmentLobes-Windows.zip
        cd ..
        echo "Packaged artifact:"
        ls -lh SegmentLobes-* || echo "ERROR: Package not created!"
        echo "Archive size:"
        du -h SegmentLobes-*
    
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: SegmentLobes-windows-latest
        path: SegmentLobes-*
        if-no-files-found: error
        retention-days: 90
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: SegmentLobes-*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  download-models:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      github.event.inputs.platforms == 'all' ||
      contains(github.event.inputs.platforms, 'models')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install TotalSegmentator
      run: |
        python -m pip install --upgrade pip
        pip install TotalSegmentator

    - name: Download lung lobe models
      run: python download_models.py

    - name: Package models
      run: |
        tar -czf TotalSegmentator-Models.tar.gz totalseg_data/
        echo "Model archive size:"
        ls -lh TotalSegmentator-Models.tar.gz

    - name: Upload models artifact
      uses: actions/upload-artifact@v4
      with:
        name: TotalSegmentator-Models
        path: TotalSegmentator-Models.tar.gz
        if-no-files-found: error
        retention-days: 90

    - name: Upload models to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: TotalSegmentator-Models.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
