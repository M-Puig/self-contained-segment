name: Build Executables

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Required for creating releases

jobs:
  build:
    strategy:
      fail-fast: false  # Continue all builds even if one fails
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.10']
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-gui.txt
    
    - name: Build with PyInstaller
      run: python build_executable.py
    
    - name: Package executable
      shell: bash
      run: |
        cd dist
        if [ \"$RUNNER_OS\" == \"Windows\" ]; then
          ARTIFACT_NAME=\"SegmentLobes-Windows.zip\"
          powershell Compress-Archive -Path SegmentLobes -DestinationPath ../\"$ARTIFACT_NAME\"
        elif [ \"$RUNNER_OS\" == \"macOS\" ]; then
          ARTIFACT_NAME=\"SegmentLobes-macOS.zip\"
          zip -r ../\"$ARTIFACT_NAME\" SegmentLobes
        else
          ARTIFACT_NAME=\"SegmentLobes-Linux.tar.gz\"
          tar -czf ../\"$ARTIFACT_NAME\" SegmentLobes
        fi
        cd ..
    
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: SegmentLobes-${{ matrix.os }}
        path: |
          SegmentLobes-Windows.zip
          SegmentLobes-macOS.zip
          SegmentLobes-Linux.tar.gz
        retention-days: 90
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          SegmentLobes-Windows.zip
          SegmentLobes-macOS.zip
          SegmentLobes-Linux.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
